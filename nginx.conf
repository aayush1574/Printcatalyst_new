# PrintCatalyst High-Performance Production Nginx Load Balancer & Reverse Proxy Configuration

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main buffer=16k flush=2m;
    error_log /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Client limits & timeouts
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_header_timeout 15;
    client_body_timeout 15;
    send_timeout 15;

    # Rate Limiting (Prevents DDoS and brute-force)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream Node.js Cluster (Load Balanced)
    upstream printcatalyst_backend {
        least_conn; # Load balance to worker with fewest active connections
        server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5001 max_fails=3 fail_timeout=10s backup;
        keepalive 64;
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    server {
        listen 80;
        server_name printcatalyst.in www.printcatalyst.in;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name printcatalyst.in www.printcatalyst.in;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/printcatalyst.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/printcatalyst.in/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers (Lighthouse 100% Security Score)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Static Client Assets (Vite build output) with CDN caching
        location /assets/ {
            root /var/www/printcatalyst/dist;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Static Uploads (PDFs, Images)
        location /uploads/ {
            alias /var/www/printcatalyst/server/uploads/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800";
            try_files $uri @backend;
        }

        # WebSocket Reverse Proxy for Live Print Spooler & Dashboards
        location /ws {
            proxy_pass http://printcatalyst_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # API Routes with Rate Limiting & Upstream Load Balancing
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            limit_conn conn_limit 30;

            proxy_pass http://printcatalyst_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffering & timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 32k;
        }

        # Single Page Application fallback to index.html
        location / {
            root /var/www/printcatalyst/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location @backend {
            proxy_pass http://printcatalyst_backend;
        }
    }
}
